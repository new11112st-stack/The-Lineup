workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Recreate Android folder
        script: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android
          flutter create --platforms=android --org com.takweela --project-name takweela .
          cp /tmp/google-services.json android/app/google-services.json

      - name: Patch Android config files
        script: |
          python3 << 'PYEOF'
          import os, re, glob

          # === 1. Find and patch build.gradle(.kts) ===
          build_files = glob.glob("android/app/build.gradle*")
          if not build_files:
              print("ERROR: No build.gradle found!")
              exit(1)

          build_file = build_files[0]
          print(f"Patching: {build_file}")
          content = open(build_file).read()

          # Add google-services plugin
          if "com.google.gms.google-services" not in content:
              if ".kts" in build_file:
                  content = content.replace(
                      'id("dev.flutter.flutter-gradle-plugin")',
                      'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")'
                  )
              else:
                  content = content.replace(
                      'id "dev.flutter.flutter-gradle-plugin"',
                      'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"'
                  )

          # Change namespace and applicationId
          content = content.replace('"com.takweela.takweela"', '"com.takweela.app"')

          # Set minSdk to 23
          content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', content)
          content = re.sub(r"minSdk\s+flutter\.minSdkVersion", "minSdk 23", content)

          # Add multiDexEnabled
          if "multiDexEnabled" not in content:
              content = content.replace(
                  'versionName = flutterVersionName',
                  'versionName = flutterVersionName\n        multiDexEnabled = true'
              )
              content = content.replace(
                  'versionName flutterVersionName\n',
                  'versionName flutterVersionName\n        multiDexEnabled true\n'
              )

          # Add Firebase dependencies
          if "firebase-bom" not in content:
              if ".kts" in build_file:
                  firebase_deps = '''
          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
              implementation("com.google.firebase:firebase-firestore")
              implementation("androidx.multidex:multidex:2.0.1")
          }
          '''
                  content += "\n" + firebase_deps
              else:
                  firebase_deps = '''
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          '''
                  content += "\n" + firebase_deps

          open(build_file, 'w').write(content)
          print(f"Patched {build_file} successfully")

          # === 2. Find and patch settings.gradle(.kts) ===
          settings_files = glob.glob("android/settings.gradle*")
          if not settings_files:
              print("ERROR: No settings.gradle found!")
              exit(1)

          settings_file = settings_files[0]
          print(f"Patching: {settings_file}")
          content = open(settings_file).read()

          if "com.google.gms.google-services" not in content:
              if ".kts" in settings_file:
                  # Find the plugins block that has com.android.application
                  content = content.replace(
                      'id("com.android.application")',
                      'id("com.android.application")\n    id("com.google.gms.google-services") version "4.4.2" apply false'
                  )
              else:
                  content = content.replace(
                      'id "com.android.application"',
                      'id "com.android.application"\n    id "com.google.gms.google-services" version "4.4.2" apply false'
                  )

          open(settings_file, 'w').write(content)
          print(f"Patched {settings_file} successfully")

          # === 3. Print final files for debugging ===
          print("\n=== FINAL build file ===")
          print(open(build_file).read())
          print("\n=== FINAL settings file ===")
          print(open(settings_file).read())
          PYEOF

      - name: Update AndroidManifest
        script: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

              <application
                  android:label="التشكيلة"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|density|uiMode"
                      android:windowSoftInputMode="adjustResize"
                      android:hardwareAccelerated="true">

                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
