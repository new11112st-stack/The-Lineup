workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Recreate Android folder
        script: |
          # حفظ الملفات المهمة
          cp android/app/google-services.json /tmp/google-services.json

          # حذف مجلد android القديم
          rm -rf android

          # إعادة إنشاء مجلد android بالإعدادات الحديثة
          flutter create --platforms=android --org com.takweela --project-name takweela .

          # إعادة ملف google-services.json
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Android project
        script: |
          # تحديد نوع ملف settings
          if [ -f "android/settings.gradle.kts" ]; then
            SETTINGS_FILE="android/settings.gradle.kts"
            echo "Found Kotlin DSL settings file"
          elif [ -f "android/settings.gradle" ]; then
            SETTINGS_FILE="android/settings.gradle"
            echo "Found Groovy settings file"
          else
            echo "ERROR: No settings.gradle file found!"
            ls -la android/
            exit 1
          fi

          echo "Settings file: $SETTINGS_FILE"

          # تحديد نوع build.gradle
          if [ -f "android/app/build.gradle.kts" ]; then
            BUILD_FILE="android/app/build.gradle.kts"
            echo "Found Kotlin DSL build file"

            cat > "$BUILD_FILE" << 'BUILDKTS'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
              id("com.google.gms.google-services")
          }

          val localProperties = java.util.Properties()
          val localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.reader(Charsets.UTF_8).use { reader ->
                  localProperties.load(reader)
              }
          }

          val flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
          val flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

          android {
              namespace = "com.takweela.app"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.takweela.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = flutterVersionCode.toInt()
                  versionName = flutterVersionName
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
              implementation("com.google.firebase:firebase-firestore")
              implementation("androidx.multidex:multidex:2.0.1")
          }
          BUILDKTS

          elif [ -f "android/app/build.gradle" ]; then
            BUILD_FILE="android/app/build.gradle"
            echo "Found Groovy build file"

            cat > "$BUILD_FILE" << 'BUILDGROOVY'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
          def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

          android {
              namespace "com.takweela.app"
              compileSdk 35
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.takweela.app"
                  minSdk 23
                  targetSdk 35
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          BUILDGROOVY
          fi

          # إضافة google-services plugin إلى settings
          if [ -f "android/settings.gradle.kts" ]; then
            if ! grep -q "com.google.gms.google-services" android/settings.gradle.kts; then
              # إضافة في Kotlin DSL
              echo '' >> android/settings.gradle.kts
              echo 'plugins {' > /tmp/gms_plugin.txt
              echo '    id("com.google.gms.google-services") version "4.4.2" apply false' >> /tmp/gms_plugin.txt
              echo '}' >> /tmp/gms_plugin.txt
              # نستخدم طريقة بديلة: نضيف السطر داخل block الـ plugins الموجود
              python3 -c "
          content = open('android/settings.gradle.kts').read()
          # Find the last plugins block and add our plugin
          if 'com.google.gms.google-services' not in content:
              # Add before the last closing brace of plugins block
              import re
              # Find plugins blocks
              pattern = r'(plugins\s*\{[^}]*)(})'
              matches = list(re.finditer(pattern, content))
              if matches:
                  last = matches[-1]
                  new_content = content[:last.end(1)] + '    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false\n' + content[last.start(2):]
                  open('android/settings.gradle.kts', 'w').write(new_content)
                  print('Added google-services to settings.gradle.kts')
              else:
                  print('Could not find plugins block, appending')
                  content += '\nplugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false\n}\n'
                  open('android/settings.gradle.kts', 'w').write(content)
          "
            fi
          elif [ -f "android/settings.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/settings.gradle; then
              python3 -c "
          content = open('android/settings.gradle').read()
          if 'com.google.gms.google-services' not in content:
              import re
              pattern = r'(plugins\s*\{[^}]*)(})'
              matches = list(re.finditer(pattern, content))
              if matches:
                  last = matches[-1]
                  new_content = content[:last.end(1)] + '    id \"com.google.gms.google-services\" version \"4.4.0\" apply false\n' + content[last.start(2):]
                  open('android/settings.gradle', 'w').write(new_content)
                  print('Added google-services to settings.gradle')
          "
            fi
          fi

          echo "=== Final settings file ==="
          cat "$SETTINGS_FILE"
          echo ""
          echo "=== Final build file ==="
          cat "$BUILD_FILE"

      - name: Update AndroidManifest
        script: |
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

              <application
                  android:label="التشكيلة"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|density|uiMode"
                      android:windowSoftInputMode="adjustResize"
                      android:hardwareAccelerated="true">

                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
