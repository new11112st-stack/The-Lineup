name: takweela
description: التشكيلة — تطبيق حجز مقاعد كرة القدم
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.4

  # Image picking & compression
  image_picker: ^1.1.2
  flutter_image_compress_lite: ^2.9.2

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
